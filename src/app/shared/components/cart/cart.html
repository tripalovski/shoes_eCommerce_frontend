<div class="mt-4">
    <h2>Korpa</h2>
    <table class="table">
    <thead>
        <tr>
        <th>Proizvod</th>
        <th>Cena</th>
        <th>Količina</th>
        <th>Ukupno</th>
        <th></th>
        </tr>
    </thead>
    <tbody>
        @for (item of cartService.cart$ | async; track $index) {
        <tr>
            <td>{{ item.name }}</td>
            <td>{{ item.price }} RSD</td>
            <td>{{ item.quantity }}</td>
            <td>{{ item.price * item.quantity }} RSD</td>
            <td><button class="btn btn-danger btn-sm" (click)="cartService.addItem(item, 1)">Add</button></td>
            <td><button class="btn btn-danger btn-sm" (click)="cartService.decreaseItemQuantity(item.id, 1)">Remove</button></td>
            <td><button class="btn btn-danger btn-sm" (click)="cartService.removeItem(item.id)">Ukloni</button></td>
        </tr>
        }
    </tbody>
    </table>

    <div class="d-flex justify-content-between align-items-center">
    <h5>Ukupno za plaćanje: {{ cartService.getTotal() }} RSD</h5>
    <button class="btn btn-success" (click)="checkout()">Kupi</button>
    </div>
</div>
