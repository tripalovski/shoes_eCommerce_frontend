<div class="container mt-4">
  <div class="row">

    <div class="col-md-3">
      <app-filter-footwear-sidebar
        [shoes]="shoes"
        [brands]="brands"
        (filterShoes)="applyFilter($event)"
      ></app-filter-footwear-sidebar>
    </div>

   <!-- Products list -->
    <div class="col-md-9">
        <app-footwear-display-list
            [filteredShoes]="filteredShoes"  
            [contentTemplate]="buttonsTemplate"    
        >
        </app-footwear-display-list>
        <ng-template #buttonsTemplate let-shoe>
            <button class="btn btn-primary w-100" (click)="addToCart(shoe)">Add to cart</button>
        </ng-template>

        <button class="btn btn-dark mt-4" (click)="showCart = !showCart">
        Prikaži korpu ({{ (cartService.cart$ | async)?.length || 0 }})
      </button>

      @if(showCart){
        <app-cart></app-cart>
      }
    </div>
    
  </div>
</div>
