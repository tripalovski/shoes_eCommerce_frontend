<div class="container mt-4">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-3">
            <div class="card p-3">
                <h5>Filteri</h5>
                <hr>

                <!-- Cena -->
                <label class="form-label">Cena</label>
                <input type="range" class="form-range" min="5000" max="30000" [(ngModel)]="maxCena">
                <p>Maksimalna cena: {{ maxCena }} RSD</p>

                <!-- Brend -->
                <label class="form-label mt-2">Brend</label>
                <select class="form-select" [(ngModel)]="odabraniBrend">
                    <option value="">Svi</option>
                    <option *ngFor="let brend of brendovi" [value]="brend">{{ brend }}</option>
                </select>
            </div>
        </div>

        <!-- Kartice sa patikama -->
        <div class="col-md-9">
            <div class="row">
                @for (patika of filtriranePatike(); track $index) 
                {
                    <div class="col-md-4 mb-4">
                        <div class="card h-100">
                            <img [src]="patika.slika" class="card-img-top" alt="{{ patika.naziv }}">
                            <div class="card-body">
                                <h5 class="card-title">{{ patika.naziv }}</h5>
                                <p class="card-text">{{ patika.brend }}</p>
                                <p class="card-text fw-bold">{{ patika.cena }} RSD</p>
                                <button class="btn btn-primary w-100">Dodaj u korpu</button>
                            </div>
                        </div>
                    </div>
                }
            </div>
        </div>
    </div>
</div>
