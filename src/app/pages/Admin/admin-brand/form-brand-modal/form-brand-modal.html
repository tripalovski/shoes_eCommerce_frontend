<!-- Bootstrap Modal -->
<div class="modal fade" [id]="modalId" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    {{ modalTitle }}
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input type="text" class="form-control" [(ngModel)]="formBrand.name" name="name" />
                </div>

                <div class="mb-3">
                    <label class="form-label">Country</label>
                    <input type="text" class="form-control" [(ngModel)]="formBrand.country" name="country" />
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea class="form-control" rows="3" [(ngModel)]="formBrand.description"
                        name="description"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Website</label>
                    <input type="url" class="form-control" [(ngModel)]="formBrand.website" name="website" />
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    Cancel
                </button>
                <button type="button" class="btn btn-primary" data-bs-dismiss="modal" (click)="onSave()">
                    Save
                </button>
            </div>
        </div>
    </div>
</div>
