<div class="container mt-4">
  <div class="row">
    <!-- Sidebar -->
    <div class="col-md-3">
          <!-- Sidebar -->
        <app-filter-footwear-sidebar
            [shoes]="shoes"
            (filterShoes)="applyFilter($event)"
        >   
            <!-- Add New Footwear button -->
            <button class="btn btn-success mt-3 w-100" data-bs-toggle="modal" data-bs-target="#createModal"
                (click)="openCreateModal()">
                + Add Shoe
            </button>       
        </app-filter-footwear-sidebar>
    </div>


    <!-- Products list -->
    <div class="col-md-9">
      <div class="row">
        @for (shoe of filteredShoes; track $index) {
        <div class="col-md-4 mb-4">
          <div class="card h-100">
            <img [src]="shoe.imageUrl" class="card-img-top" alt="{{ shoe.name }}" />
            <div class="card-body">
              <h5 class="card-title">{{ shoe.name }}</h5>
              <p class="card-text">{{ shoe.brand }}</p>
              <p class="card-text fw-bold">{{ shoe.price }} RSD</p>
              <button class="btn btn-danger w-100" (click)="deleteShoe(shoe.id)">Delete</button>
              <button class="btn btn-warning w-100 mb-2" (click)="openEditModal(shoe)"
                data-bs-toggle="modal" data-bs-target="#editModal">Edit</button>
            </div>
          </div>
        </div>
        }
      </div>
    </div>
  </div>
</div>


<app-create-shoe-modal
    idModal="createModal"
    modalTitle="Add New Footwear"
    [formShoe]="formShoe"
    (save)="createShoe()"
></app-create-shoe-modal>

<app-create-shoe-modal
    idModal="editModal"
    modalTitle="Edit Footwear"
    [formShoe]="formShoe"
    (save)="editShoe()"
></app-create-shoe-modal>
