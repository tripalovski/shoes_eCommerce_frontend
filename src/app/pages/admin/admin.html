<div class="container mt-4">
  <div class="row">
    <!-- Sidebar -->
    <div class="col-md-3">
      <div class="card p-3">
        <h5>Filters</h5>
        <hr>

        <!-- Price filter -->
        <label class="form-label">Max Price</label>
        <input type="range" class="form-range" min="5000" max="30000" [(ngModel)]="maxPrice" (change)="applyFilter()" />
        <p>Maximum price: {{ maxPrice }} RSD</p>

        <!-- Brand filter -->
        <label class="form-label mt-2">Brand</label>
        <select class="form-select" [(ngModel)]="selectedBrand" (change)="applyFilter()">
          <option value="">All</option>

          @for (brand of brands; track $index) {
          <option [value]="brand">{{ brand }}</option>
          }
        </select>

        <!-- Add button -->
        <button class="btn btn-success mt-3 w-100" data-bs-toggle="modal" data-bs-target="#createModal"
          (click)="openCreateModal()">
          + Add Shoe
        </button>
      </div>
    </div>

    <!-- Products list -->
    <div class="col-md-9">
      <div class="row">
        @for (shoe of filteredShoes; track $index) {
        <div class="col-md-4 mb-4">
          <div class="card h-100">
            <img [src]="shoe.imageUrl" class="card-img-top" alt="{{ shoe.name }}" />
            <div class="card-body">
              <h5 class="card-title">{{ shoe.name }}</h5>
              <p class="card-text">{{ shoe.brand }}</p>
              <p class="card-text fw-bold">{{ shoe.price }} RSD</p>
              <button class="btn btn-danger w-100" (click)="deleteShoe(shoe.id)">Delete</button>
              <button class="btn btn-warning w-100 mb-2" (click)="openEditModal(shoe)"
                data-bs-toggle="modal" data-bs-target="#editModal">Edit</button>
            </div>
          </div>
        </div>
        }
      </div>
    </div>
  </div>
</div>


<app-create-shoe-modal
    idModal="createModal"
    modalTitle="Add New Footwear"
    [formShoe]="formShoe"
    (save)="createShoe()"
></app-create-shoe-modal>

<app-create-shoe-modal
    idModal="editModal"
    modalTitle="Edit Footwear"
    [formShoe]="formShoe"
    (save)="editShoe()"
></app-create-shoe-modal>
