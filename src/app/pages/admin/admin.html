<div class="container mt-4">
  <div class="row">

    <!-- Sidebar -->
    <div class="col-md-3">
          <!-- Sidebar -->
        <app-filter-footwear-sidebar
            [shoes]="shoes"
            [brands]="brands"
            (filterShoes)="applyFilter($event)"
        >   
            <!-- Add New Footwear button -->
            <button class="btn btn-success mt-3 w-100" data-bs-toggle="modal" data-bs-target="#createModal"
                (click)="openCreateModal()">
                + Add Shoe
            </button>       
        </app-filter-footwear-sidebar>
    </div>

    <!-- Products list -->
    <div class="col-md-9">
        <app-footwear-display-list
            [filteredShoes]="filteredShoes"  
            [contentTemplate]="buttonsTemplate"    
        >
        </app-footwear-display-list>
        <ng-template #buttonsTemplate let-shoe>
            <button class="btn btn-warning w-100 mb-2" (click)="openEditModal(shoe)" data-bs-toggle="modal" data-bs-target="#editModal">Edit</button>
            <button class="btn btn-danger w-100" (click)="deleteShoe(shoe.id)">Delete</button>
        </ng-template>
    </div>
    
  </div>
</div>


<app-create-shoe-modal
    idModal="createModal"
    modalTitle="Add New Footwear"
    [formShoe]="formShoe"
    (save)="createShoe()"
></app-create-shoe-modal>

<app-create-shoe-modal
    idModal="editModal"
    modalTitle="Edit Footwear"
    [formShoe]="formShoe"
    (save)="editShoe()"
></app-create-shoe-modal>
