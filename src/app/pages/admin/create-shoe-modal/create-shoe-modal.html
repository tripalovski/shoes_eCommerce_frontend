<!-- Create Modal -->
<div class="modal fade" [id]="idModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">{{modalTitle}}</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body">
        <!-- Name -->
        <label class="form-label">Name</label>
        <input class="form-control mb-2" [(ngModel)]="formShoe.name" placeholder="e.g. Air Max 90" />

        <!-- Brand -->
        <label class="form-label">Brand</label>
        <select class="form-select" [(ngModel)]="formShoe.brand">
          @for (brand of brands; track $index) {
            <option [value]="brand.name">{{brand.name}}</option>
          }
        </select>

        <!-- Color -->
        <label class="form-label">Color</label>
        <input class="form-control mb-2" [(ngModel)]="formShoe.color" placeholder="e.g. White" />

        <!-- Size -->
        <label class="form-label">Size (EU)</label>
        <input class="form-control mb-2" [(ngModel)]="formShoe.size" min="30" max="50" />

        <!-- Price -->
        <label class="form-label">Price (RSD)</label>
        <input type="number" class="form-control mb-2" [(ngModel)]="formShoe.price" min="1" />

        <!-- Stock -->
        <label class="form-label">Stock</label>
        <input type="number" class="form-control mb-2" [(ngModel)]="formShoe.stock" min="0" />

        <!-- Image URL -->
        <label class="form-label">Image URL</label>
        <input class="form-control mb-2" [(ngModel)]="formShoe.imageUrl" placeholder="https://..." />

        <!-- Description -->
        <label class="form-label">Description</label>
        <textarea class="form-control" rows="3" [(ngModel)]="formShoe.description"
          placeholder="Short description"></textarea>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-success" (click)="onSave()" data-bs-dismiss="modal">
            Save
        </button>
      </div>
    </div>
  </div>
</div>
